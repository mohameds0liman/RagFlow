
<style>
#erd { padding: 1rem 0; }
#erd svg { display: block; width: 100%; }
</style>

<h2 class="sr-only" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">RagFlow system database schema showing all tables and their relationships</h2>

<div id="erd"></div>

<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
    primaryColor: dark ? '#2a2a28' : '#f5f4f0',
    primaryBorderColor: dark ? '#4a4845' : '#c4c2b9',
    primaryTextColor: dark ? '#c2c0b6' : '#3d3d3a',
    secondaryColor: dark ? '#1e1e1c' : '#eceae3',
    tertiaryColor: dark ? '#252523' : '#f0ede6',
    attributeBackgroundColorOdd: dark ? '#252523' : '#f9f8f5',
    attributeBackgroundColorEven: dark ? '#1e1e1c' : '#f2f0ea',
  },
});

const diagram = `erDiagram

  user {
    uuid id PK
    string username
    string email
    string password_hash
    enum role
    bool is_active
    bool is_verified
    timestamp email_verified_at
    string refresh_token_hash
    string reset_password_token
    timestamp reset_password_expires_at
    timestamp last_login_at
    timestamp created_at
    timestamp updated_at
  }

  document_store {
    uuid id PK
    uuid created_by FK
    string name
    text description
    enum status
    json vector_store_config
    json embedding_config
    json record_manager_config
    timestamp created_date
    timestamp updated_date
  }

  document_loader {
    uuid id PK
    uuid doc_id FK
    string name
    string loader_type
    json loader_config
    string source_path
    enum status
    timestamp created_date
    timestamp updated_date
  }

  document_splitter {
    uuid id PK
    uuid loader_id FK
    string splitter_type
    int chunk_size
    int chunk_overlap
    json extra_config
    timestamp created_date
    timestamp updated_date
  }

  document_chunk {
    uuid id PK
    uuid store_id FK
    uuid loader_id FK
    uuid splitter_id FK
    text page_content
    json metadata
    int chunk_no
    enum status
    timestamp created_date
    timestamp updated_date
  }

  upsertion_record {
    uuid id PK
    uuid store_id FK
    string key
    string namespace
    float updated_at
    string group_id
    string source_hash
  }

  chatbot {
    uuid id PK
    uuid created_by FK
    uuid document_store_id FK
    string name
    text description
    bool is_active
    json vector_store_config
    json llm_config
    json chain_config
    timestamp created_date
    timestamp updated_date
  }

  chat_session {
    uuid id PK
    uuid chatbot_id FK
    uuid user_id FK
    string title
    timestamp created_date
    timestamp updated_date
  }

  chat_message {
    uuid id PK
    uuid session_id FK
    uuid user_id FK
    enum role
    text content
    json source_documents
    float execution_time
    timestamp created_date
  }

  user ||--o{ document_store : "creates"
  user ||--o{ chatbot : "creates"
  user ||--o{ chat_session : "starts"
  user ||--o{ chat_message : "sends"

  document_store ||--o{ document_loader : "has"
  document_store ||--o{ document_chunk : "stores"
  document_store ||--o{ upsertion_record : "tracked by"
  document_store ||--o{ chatbot : "used by"

  document_loader ||--|| document_splitter : "configured with"
  document_loader ||--o{ document_chunk : "produces"

  document_splitter ||--o{ document_chunk : "shapes"

  chatbot ||--o{ chat_session : "hosts"

  chat_session ||--o{ chat_message : "contains"
`;

const { svg } = await mermaid.render('erd-svg', diagram);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg .node, #erd svg .er').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = nums.filter((_, i) => i % 2 === 0);
  const ys = nums.filter((_, i) => i % 2 === 1);
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd svg .row-rect-odd path, #erd svg .row-rect-even path, #erd svg .row-rect-odd rect, #erd svg .row-rect-even rect').forEach(p => {
  p.setAttribute('stroke', 'none');
});

const svgEl = document.querySelector('#erd svg');
if (svgEl) {
  svgEl.style.maxWidth = '100%';
  svgEl.removeAttribute('height');
}
</script>
