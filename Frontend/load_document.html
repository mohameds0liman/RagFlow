<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Load Document</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen flex items-center justify-center">

  <!-- BASE URL of your FastAPI server -->
  <script>
    const BASE_URL = "http://localhost:8000/admin"
  </script>

  <!-- ===================== MAIN SCREEN ===================== -->
  <div id="main-screen">
    <button
      onclick="openToolPicker()"
      class="bg-blue-600 hover:bg-blue-500 text-white font-bold px-8 py-4 rounded-xl text-lg transition">
      Load Document +
    </button>
  </div>

  <!-- ===================== MODAL OVERLAY ===================== -->
  <div id="modal" class="hidden fixed inset-0 bg-black/70 flex items-center justify-center z-50">
    <div class="bg-gray-900 rounded-2xl p-8 w-full max-w-md shadow-2xl">

      <!-- STEP 1: Pick a loader tool -->
      <div id="step-pick-tool">
        <h2 class="text-xl font-bold mb-4">Choose a Loader Tool</h2>
        <div id="tool-list" class="space-y-2">
          <!-- dynamically filled -->
          <p class="text-gray-400 text-sm">Loading...</p>
        </div>
        <button onclick="closeModal()" class="mt-6 text-gray-500 hover:text-white text-sm">Cancel</button>
      </div>

      <!-- STEP 2: Fill fields for chosen tool -->
      <div id="step-fill-fields" class="hidden">
        <h2 class="text-xl font-bold mb-1">Configure <span id="tool-title" class="text-blue-400"></span></h2>
        <p class="text-gray-500 text-sm mb-4">Fill in the required fields</p>

        <form id="fields-form" class="space-y-4">
          <!-- dynamically filled -->
        </form>

        <div class="flex gap-3 mt-6">
          <button onclick="backToToolPicker()" class="text-gray-500 hover:text-white text-sm">Back</button>
          <button
            onclick="submitForm()"
            class="ml-auto bg-blue-600 hover:bg-blue-500 px-6 py-2 rounded-lg font-semibold transition">
            Process
          </button>
        </div>
      </div>

      <!-- STEP 3: Result -->
      <div id="step-result" class="hidden">
        <h2 class="text-xl font-bold mb-4">Result</h2>
        <div id="result-box" class="bg-gray-800 rounded-lg p-4 text-sm text-gray-300 max-h-64 overflow-y-auto whitespace-pre-wrap"></div>
        <button onclick="closeModal()" class="mt-6 text-gray-500 hover:text-white text-sm">Close</button>
      </div>

    </div>
  </div>


  <!-- ===================== JS LOGIC ===================== -->
  <script>

    let selectedTool = null  // stores the chosen tool name

    // --------------------------------------------------
    // Open modal + fetch loader tools list
    // --------------------------------------------------
    async function openToolPicker() {
      showStep("step-pick-tool")
      document.getElementById("modal").classList.remove("hidden")

      const toolList = document.getElementById("tool-list")
      toolList.innerHTML = '<p class="text-gray-400 text-sm">Loading...</p>'

      try {
        // GET /admin/components?category=loader
        const res = await fetch(`${BASE_URL}/components?category=loader`)
        const data = await res.json()  // { "PyPDFLoader": [...inputs] }

        toolList.innerHTML = ""

        // Render one button per tool
        Object.keys(data).forEach(toolName => {
          const btn = document.createElement("button")
          btn.textContent = toolName
          btn.className = "w-full text-left px-4 py-3 bg-gray-800 hover:bg-gray-700 rounded-lg transition text-sm font-medium"
          btn.onclick = () => loadToolSchema(toolName)
          toolList.appendChild(btn)
        })

      } catch (err) {
        toolList.innerHTML = `<p class="text-red-400 text-sm">Error: ${err.message}</p>`
      }
    }

    // --------------------------------------------------
    // User picked a tool → fetch its schema → render fields
    // --------------------------------------------------
    async function loadToolSchema(toolName) {
      selectedTool = toolName

      try {
        // GET /admin/components/PyPDFLoader/schema?category=loader
        const res = await fetch(`${BASE_URL}/components/${toolName}/schema?category=loader`)
        const schema = await res.json()
        // schema.inputs = [ { name, type, required, default, description } ]

        renderFields(schema)
        showStep("step-fill-fields")

      } catch (err) {
        alert(`Failed to load schema: ${err.message}`)
      }
    }

    // --------------------------------------------------
    // Dynamically render form fields from schema inputs
    // --------------------------------------------------
    function renderFields(schema) {
      document.getElementById("tool-title").textContent = schema.name

      const form = document.getElementById("fields-form")
      form.innerHTML = ""

      schema.inputs.forEach(input => {
        const wrapper = document.createElement("div")

        // Label
        const label = document.createElement("label")
        label.textContent = input.name + (input.required ? " *" : "")
        label.className = "block text-sm font-medium text-gray-300 mb-1"

        // Input field
        const field = document.createElement("input")
        field.name = input.name                          // key that goes into build_config
        field.type = input.type === "int" ? "number" : "text"
        field.placeholder = input.description || input.name
        field.required = input.required
        field.value = input.default ?? ""
        field.className = "w-full bg-gray-800 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white placeholder-gray-500 focus:outline-none focus:border-blue-500"

        wrapper.appendChild(label)
        wrapper.appendChild(field)
        form.appendChild(wrapper)
      })
    }

    // --------------------------------------------------
    // Collect field values → POST to load_document
    // --------------------------------------------------
    async function submitForm() {
      const form = document.getElementById("fields-form")
      const inputs = form.querySelectorAll("input")

      // Build build_config dict from field name → value
      const build_config = {}
      inputs.forEach(input => {
        build_config[input.name] = input.value
      })

      const body = {
        loader_name: selectedTool,
        build_config: build_config
      }

      const resultBox = document.getElementById("result-box")
      showStep("step-result")
      resultBox.textContent = "Processing..."

      try {
        // POST /admin/kb_Process/load_document
        const res = await fetch(`${BASE_URL}/kb_Process/load_document`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        })  

        const data = await res.json()
        console.log(data)  // add this line
        // Show result summary
        resultBox.textContent = JSON.stringify({
          loader: data.loader,
          document_count: data.document_count,
          first_chunk_preview: data.documents?.[0]?.page_content?.slice(0, 200) + "..."
        }, null, 2)

      } catch (err) {
        resultBox.textContent = `Error: ${err.message}`
      }
    }

    // --------------------------------------------------
    // Helpers
    // --------------------------------------------------
    function showStep(stepId) {
      ["step-pick-tool", "step-fill-fields", "step-result"].forEach(id => {
        document.getElementById(id).classList.add("hidden")
      })
      document.getElementById(stepId).classList.remove("hidden")
    }

    function backToToolPicker() {
      showStep("step-pick-tool")
    }

    function closeModal() {
      document.getElementById("modal").classList.add("hidden")
      selectedTool = null
    }

  </script>

</body>
</html>
