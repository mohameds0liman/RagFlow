<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>RAGFlow — Sign in</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f4f0;--card:#fff;--border:#e5e4df;--text:#1a1a1a;--muted:#888;
  --purple:#7F77DD;--purple-dark:#534AB7;--purple-light:#EEEDFE;
  --danger:#E24B4A;--danger-bg:#FCEBEB;
  --success:#1D9E75;--success-bg:#E1F5EE;
  --input-bg:#fff;--input-border:#d4d3ce;
}
@media(prefers-color-scheme:dark){
  :root{--bg:#1a1a1a;--card:#242424;--border:#333;--text:#f0f0f0;--muted:#888;
  --input-bg:#2a2a2a;--input-border:#444;--purple-light:#2a2860;}
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:var(--card);border:0.5px solid var(--border);border-radius:16px;padding:36px 32px;width:100%;max-width:400px}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:28px}
.logo-icon{width:36px;height:36px;border-radius:10px;background:var(--purple);display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px}
.logo-name{font-size:17px;font-weight:500;color:var(--text)}
.logo-sub{font-size:12px;color:var(--muted)}
h1{font-size:20px;font-weight:500;color:var(--text);margin-bottom:6px}
.subtitle{font-size:13px;color:var(--muted);margin-bottom:24px}
.tabs{display:flex;gap:0;border:0.5px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:24px}
.tab{flex:1;padding:8px;font-size:13px;cursor:pointer;border:none;background:transparent;color:var(--muted);font-family:inherit;transition:all .15s}
.tab.active{background:var(--purple-light);color:var(--purple-dark);font-weight:500}
.form-group{margin-bottom:14px}
label{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-bottom:6px}
input{width:100%;padding:9px 12px;border:0.5px solid var(--input-border);border-radius:8px;background:var(--input-bg);color:var(--text);font-size:13px;font-family:inherit;outline:none;transition:border-color .15s}
input:focus{border-color:var(--purple);box-shadow:0 0 0 3px rgba(127,119,221,0.12)}
.input-wrap{position:relative}
.input-wrap input{padding-right:36px}
.eye-btn{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--muted);font-size:16px;padding:2px}
.btn{width:100%;padding:10px;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;border:none;font-family:inherit;margin-top:4px;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-primary{background:var(--purple);color:#fff}
.btn-primary:hover{background:var(--purple-dark)}
.btn-primary:active{transform:scale(.98)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.alert{padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:16px;display:none;align-items:center;gap:8px}
.alert.error{background:var(--danger-bg);color:var(--danger);border:0.5px solid #F7C1C1}
.alert.success{background:var(--success-bg);color:var(--success);border:0.5px solid #9FE1CB}
.alert.show{display:flex}
.divider{height:0.5px;background:var(--border);margin:20px 0}
.footer-link{font-size:12px;color:var(--muted);text-align:center;margin-top:16px}
.footer-link a{color:var(--purple);text-decoration:none}
.spinner{width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.strength-bar{height:3px;border-radius:2px;margin-top:6px;background:var(--border);overflow:hidden}
.strength-fill{height:100%;border-radius:2px;width:0;transition:width .3s,background .3s}
.strength-label{font-size:11px;margin-top:4px}
.forgot{font-size:12px;color:var(--purple);text-decoration:none;float:right;margin-bottom:6px}
.panel{display:none}.panel.active{display:block}
</style>
</head>
<body>

<div class="card">
  <div class="logo">
    <div class="logo-icon"><i class="ti ti-robot"></i></div>
    <div>
      <div class="logo-name">RAGFlow</div>
      <div class="logo-sub">Admin panel</div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('login')" id="tab-login">Sign in</button>
    <button class="tab" onclick="switchTab('register')" id="tab-register">Register</button>
    <button class="tab" onclick="switchTab('forgot')" id="tab-forgot">Reset</button>
  </div>

  <div id="alert" class="alert"><i class="ti ti-info-circle" style="font-size:16px;flex-shrink:0"></i><span id="alert-msg"></span></div>

  <!-- LOGIN -->
  <div class="panel active" id="panel-login">
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="l-email" placeholder="you@example.com" autocomplete="email"/>
    </div>
    <div class="form-group">
      <label>Password <a class="forgot" href="#" onclick="switchTab('forgot');return false">Forgot password?</a></label>
      <div class="input-wrap">
        <input type="password" id="l-pass" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"/>
        <button class="eye-btn" onclick="toggleEye('l-pass',this)" type="button" aria-label="Toggle visibility"><i class="ti ti-eye"></i></button>
      </div>
    </div>
    <button class="btn btn-primary" id="login-btn" onclick="doLogin()">
      <span id="login-label">Sign in</span>
    </button>
  </div>

  <!-- REGISTER -->
  <div class="panel" id="panel-register">
    <div class="form-group">
      <label>Username</label>
      <input type="text" id="r-user" placeholder="johndoe" autocomplete="username"/>
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="r-email" placeholder="you@example.com" autocomplete="email"/>
    </div>
    <div class="form-group">
      <label>Password</label>
      <div class="input-wrap">
        <input type="password" id="r-pass" placeholder="Min 8 chars, letters + numbers" autocomplete="new-password" oninput="checkStrength(this.value)"/>
        <button class="eye-btn" onclick="toggleEye('r-pass',this)" type="button" aria-label="Toggle visibility"><i class="ti ti-eye"></i></button>
      </div>
      <div class="strength-bar"><div class="strength-fill" id="strength-fill"></div></div>
      <div class="strength-label" id="strength-label" style="color:var(--muted)"></div>
    </div>
    <button class="btn btn-primary" id="reg-btn" onclick="doRegister()">
      <span id="reg-label">Create account</span>
    </button>
  </div>

  <!-- FORGOT -->
  <div class="panel" id="panel-forgot">
    <div class="form-group">
      <label>Email address</label>
      <input type="email" id="f-email" placeholder="you@example.com"/>
    </div>
    <button class="btn btn-primary" id="forgot-btn" onclick="doForgot()">
      <span id="forgot-label">Send reset link</span>
    </button>
  </div>

  <div class="footer-link">
    <span id="footer-text">Don't have an account? <a href="#" onclick="switchTab('register');return false">Register</a></span>
  </div>
</div>

<script>
const API = '';

function switchTab(tab) {
  ['login','register','forgot'].forEach(t => {
    document.getElementById('tab-'+t).classList.toggle('active', t===tab);
    document.getElementById('panel-'+t).classList.toggle('active', t===tab);
  });
  clearAlert();
  const ft = document.getElementById('footer-text');
  if(tab==='login') ft.innerHTML = 'Don\'t have an account? <a href="#" onclick="switchTab(\'register\');return false">Register</a>';
  else ft.innerHTML = 'Already have an account? <a href="#" onclick="switchTab(\'login\');return false">Sign in</a>';
}

function showAlert(msg, type='error') {
  const el = document.getElementById('alert');
  document.getElementById('alert-msg').textContent = msg;
  el.className = 'alert ' + type + ' show';
}
function clearAlert() {
  document.getElementById('alert').className = 'alert';
}

function setLoading(btnId, labelId, loading, defaultText) {
  const btn = document.getElementById(btnId);
  const lbl = document.getElementById(labelId);
  btn.disabled = loading;
  lbl.innerHTML = loading ? '<div class="spinner"></div>' : defaultText;
}

function toggleEye(inputId, btn) {
  const inp = document.getElementById(inputId);
  const showing = inp.type === 'text';
  inp.type = showing ? 'password' : 'text';
  btn.innerHTML = showing ? '<i class="ti ti-eye"></i>' : '<i class="ti ti-eye-off"></i>';
}

function checkStrength(pw) {
  const fill = document.getElementById('strength-fill');
  const lbl = document.getElementById('strength-label');
  let score = 0;
  if(pw.length >= 8) score++;
  if(/[A-Za-z]/.test(pw)) score++;
  if(/[0-9]/.test(pw)) score++;
  if(/[^A-Za-z0-9]/.test(pw)) score++;
  const colors = ['#E24B4A','#EF9F27','#1D9E75','#0F6E56'];
  const labels = ['Weak','Fair','Good','Strong'];
  fill.style.width = (score*25)+'%';
  fill.style.background = colors[score-1] || '#e5e4df';
  lbl.textContent = score > 0 ? labels[score-1] : '';
  lbl.style.color = colors[score-1] || 'var(--muted)';
}

async function apiFetch(path, body, method='POST') {
  const res = await fetch(API+path, {
    method, headers:{'Content-Type':'application/json'},
    body: JSON.stringify(body), credentials:'include'
  });
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.detail || 'Request failed');
  return data;
}

async function doLogin() {
  clearAlert();
  const email = document.getElementById('l-email').value.trim();
  const password = document.getElementById('l-pass').value;
  if(!email||!password){showAlert('Please fill in all fields');return;}
  setLoading('login-btn','login-label',true,'Sign in');
  try {
    const data = await apiFetch('/auth/login',{email,password});
    localStorage.setItem('access_token', data.access_token);
    localStorage.setItem('user', JSON.stringify(data.user));
    showAlert('Signed in! Redirecting…','success');
    setTimeout(()=>{ window.location.href='admin.html'; },800);
  } catch(e) {
    showAlert(e.message);
    setLoading('login-btn','login-label',false,'Sign in');
  }
}

async function doRegister() {
  clearAlert();
  const username = document.getElementById('r-user').value.trim();
  const email = document.getElementById('r-email').value.trim();
  const password = document.getElementById('r-pass').value;
  if(!username||!email||!password){showAlert('Please fill in all fields');return;}
  setLoading('reg-btn','reg-label',true,'Create account');
  try {
    await apiFetch('/auth/register',{username,email,password});
    showAlert('Account created! Signing you in…','success');
    const data = await apiFetch('/auth/login',{email,password});
    localStorage.setItem('access_token', data.access_token);
    localStorage.setItem('user', JSON.stringify(data.user));
    setTimeout(()=>{ window.location.href='admin.html'; },900);
  } catch(e) {
    showAlert(e.message);
    setLoading('reg-btn','reg-label',false,'Create account');
  }
}

async function doForgot() {
  clearAlert();
  const email = document.getElementById('f-email').value.trim();
  if(!email){showAlert('Please enter your email');return;}
  setLoading('forgot-btn','forgot-label',true,'Send reset link');
  try {
    await apiFetch('/auth/forgot-password',{email});
    showAlert('If that email exists, a reset link has been sent.','success');
    setLoading('forgot-btn','forgot-label',false,'Send reset link');
  } catch(e) {
    showAlert(e.message);
    setLoading('forgot-btn','forgot-label',false,'Send reset link');
  }
}

if(localStorage.getItem('access_token')){
  window.location.href='admin.html';
}
</script>
</body>
</html>
